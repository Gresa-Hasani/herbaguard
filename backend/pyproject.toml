[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "herbaguard"
version = "0.1.0"
description = "HerbaGuard: evidence-based herb–drug interaction and phytotherapy evidence platform (EthnoHack 2026, Track 04)."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3.6,<1",
    "structlog>=24.4",
    "httpx>=0.27,<1",
    "tenacity>=9.0",
    "typer>=0.13",
    # Phase 2 — ingestion parsers
    "openpyxl>=3.1,<4",          # EMA herbal inventory (.xlsx)
    "pdfplumber>=0.11,<1",       # EMA monograph PDFs (word positions for two-column layout)
    "beautifulsoup4>=4.12,<5",   # EMA herb pages, NCCIH fact sheets
    "pyyaml>=6.0,<7",            # curated herb list and interaction lexicon
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
    "types-PyYAML>=6.0",
]

[project.scripts]
herbaguard = "herbaguard.ingestion.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/herbaguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "S", "C4", "DTZ", "PT"]
ignore = [
    "PLR0913",  # FastAPI dependencies legitimately take many arguments
    "PLR2004",  # magic values are fine in tests and HTTP status checks
    "E501",     # line length is enforced by `ruff format`; remaining long lines are strings/URLs
    "PLC0415",  # deliberate lazy imports (CLI start-up time, avoiding import cycles)
    "PLR0911", "PLR0912", "PLR0915", "PLR0917",  # single-pass parsers/pipelines; split would obscure logic
    "PLW2901",  # rebinding loop variables while normalising text is intentional
]

# "Herb–drug" uses an en dash deliberately in prose.
allowed-confusables = ["–", "’", "‘", "×"]  # typographic characters quoted from sources

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PT018", "RUF005"]
"alembic/**" = ["N999"]
"alembic/versions/**" = ["E501"]  # autogenerated migrations

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["herbaguard"]

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["pgvector.*", "pdfplumber.*", "pypdfium2.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requires a reachable PostgreSQL + pgvector database (HERBAGUARD_DATABASE_URL)",
    "live: calls real external APIs; opt-in only",
]
