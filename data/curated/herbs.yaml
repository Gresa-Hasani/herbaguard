# HerbaGuard curated MVP herb set (docs/research/mvp-scope.md §4.1).
#
# Authored by the HerbaGuard team; committed to the repository (source code: herbaguard_curated).
# Every value below was checked against the live source on 2026-11-02:
#   - ema_latin_name: exact "Latin name" in the EMA herbal inventory spreadsheet (Combination = No)
#   - taxa: accepted names; each resolved to exactly one accepted WFO record (wfo_id noted)
#   - ema_botanical_names: botanical names as EMA lists them (may be synonyms of `taxa`); the
#     pipeline must resolve each to one of `taxa`, otherwise it records a data-quality issue
#   - nccih_slug: https://www.nccih.nih.gov/health/<slug> returned HTTP 200 (senna: no page)
#   - pubmed_mesh: MeSH descriptor exists (PubMed count > 0)
#   - openfda_terms: phrases searched in openFDA drug-label interaction-related sections
#   - openfda_exclude: phrases that mean a *different* plant and must not be attributed here
version: 1
herbs:
  - key: st_johns_wort
    common_name: St John's wort
    ema_latin_name: Hyperici herba
    plant_part: herba
    taxa: [Hypericum perforatum]                  # wfo-0000728093
    ema_botanical_names: [Hypericum perforatum L.]
    nccih_slug: st-johns-wort
    pubmed_mesh: Hypericum
    openfda_terms: ["St. John's Wort", "St John's Wort", "Hypericum perforatum"]
    openfda_exclude: []

  - key: garlic
    common_name: Garlic
    ema_latin_name: Allii sativi bulbus
    plant_part: bulbus
    taxa: [Allium sativum]                        # wfo-0000757248
    ema_botanical_names: [Allium sativum L.]
    nccih_slug: garlic
    pubmed_mesh: Garlic
    openfda_terms: [garlic]
    openfda_exclude: []

  - key: echinacea
    common_name: Purple coneflower (Echinacea)
    ema_latin_name: Echinaceae purpureae herba
    plant_part: herba
    taxa: [Echinacea purpurea]                    # wfo-0000036347
    ema_botanical_names: [Echinacea purpurea (L.) Moench]
    nccih_slug: echinacea
    pubmed_mesh: Echinacea
    openfda_terms: [echinacea]
    openfda_exclude: []

  - key: ginseng
    common_name: Ginseng (Asian ginseng)
    ema_latin_name: Ginseng radix
    plant_part: radix
    taxa: [Panax ginseng]                         # wfo-0000263606
    ema_botanical_names: [Panax ginseng C.A.Mey.]
    nccih_slug: asian-ginseng
    pubmed_mesh: Panax
    openfda_terms: [ginseng]
    # "Siberian ginseng" is Eleutherococcus senticosus (wfo-0000948117); "American ginseng" is
    # Panax quinquefolius. Neither is the EMA substance.
    openfda_exclude: [siberian ginseng, eleuthero, american ginseng]

  - key: valerian
    common_name: Valerian
    ema_latin_name: Valerianae radix
    plant_part: radix
    taxa: [Valeriana officinalis]                 # wfo-0000426953
    ema_botanical_names: [Valeriana officinalis L.]
    nccih_slug: valerian
    pubmed_mesh: Valerian
    openfda_terms: [valerian]
    openfda_exclude: []

  - key: black_cohosh
    common_name: Black cohosh
    ema_latin_name: Cimicifugae rhizoma
    plant_part: rhizoma
    taxa: [Actaea racemosa]                       # wfo-0000519114 (EMA name Cimicifuga racemosa is a synonym)
    ema_botanical_names: [Cimicifuga racemosa (L.) Nutt.]
    nccih_slug: black-cohosh
    pubmed_mesh: Cimicifuga
    openfda_terms: [black cohosh, cimicifuga]
