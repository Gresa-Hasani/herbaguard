# HerbaGuard interaction lexicon — drug and drug-class phrases → RxNorm / ATC.
#
# Authored by the HerbaGuard team (source code: herbaguard_curated) after reading the extracted
# EMA monograph sections 4.3/4.5 of all 16 curated herbs and the NCCIH "What Do We Know About
# Safety?" sections (retrieved 2026-11-02). `seen_in` records where each phrase occurs, so every
# entry can be traced to real source wording.
#
# Rules
#   - Drugs map to an RxNorm *ingredient* name; the pipeline resolves it via RxNav and records a
#     data-quality issue if it does not resolve (it is never guessed).
#   - Classes map to one or more ATC codes. Several codes are used when a phrase covers several
#     ATC groups (e.g. "anticoagulants"); each code yields its own assertion, all quoting the same
#     source text. The source's own wording is always stored verbatim alongside.
#   - `unmapped` lists phrases recognised as drug references that have NO defensible ATC mapping.
#     They are recorded as data-quality issues (lexicon_term_unmapped) instead of being forced.
#   - Matching is case-insensitive, on word boundaries, longest phrase first.
version: 1

drugs:
  - {name: cyclosporine, patterns: [cyclosporine, ciclosporin, cyclosporin], seen_in: [ema:st_johns_wort, nccih:st-johns-wort]}
