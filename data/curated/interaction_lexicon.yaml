  - {name: amitriptyline, patterns: [amitriptyline], seen_in: [ema:st_johns_wort, nccih:st-johns-wort]}
  - {name: fexofenadine, patterns: [fexofenadine], seen_in: [ema:st_johns_wort]}
  - {name: alprazolam, patterns: [alprazolam], seen_in: [ema:st_johns_wort]}
  - {name: diazepam, patterns: [diazepam], seen_in: [ema:st_johns_wort]}
  - {name: midazolam, patterns: [midazolam], seen_in: [ema:st_johns_wort, ema:liquorice]}
