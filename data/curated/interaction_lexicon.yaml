  - {label: anticoagulants, atc: [B01AA, B01AB, B01AE, B01AF], patterns: [anticoagulants, anticoagulant drugs, anticoagulant], seen_in: [ema:ginkgo, nccih:ginkgo, nccih:garlic, nccih:cranberry]}
  - {label: oral anticoagulants, atc: [B01AA, B01AE, B01AF], patterns: [oral anticoagulation therapy, oral anticoagulants], seen_in: [ema:garlic]}
  - {label: blood thinners (lay term), atc: [B01AA, B01AB, B01AE, B01AF, B01AC], patterns: [blood thinner, blood thinners], seen_in: [nccih:st-johns-wort, nccih:cranberry]}
  - {label: antiplatelet agents, atc: [B01AC], patterns: [anti-platelet therapy, antiplatelet therapy, antiplatelet drugs, anti-platelet drugs], seen_in: [ema:garlic, ema:ginkgo]}
  - {label: NSAIDs, atc: [M01A], patterns: [non-steroidal anti-inflammatory drugs, nonsteroidal anti-inflammatory drugs, NSAIDs], seen_in: [ema:ginkgo]}
  - {label: HIV protease inhibitors, atc: [J05AE], patterns: [protease inhibitors], seen_in: [ema:st_johns_wort]}
  - {label: nucleoside reverse transcriptase inhibitors, atc: [J05AF], patterns: [nucleoside reverse transcriptase inhibitors], seen_in: [ema:st_johns_wort]}
  - {label: HIV drugs (lay term), atc: [J05AE, J05AF, J05AG, J05AJ], patterns: [HIV drugs, HIV medicines, HIV medications], seen_in: [nccih:st-johns-wort]}
  - {label: antiretrovirals, atc: [J05AE, J05AF, J05AG, J05AJ], patterns: [antiretroviral regime, antiretroviral therapy, antiretrovirals], seen_in: [ema:garlic]}
  - {label: cytostatic / antineoplastic agents, atc: [L01], patterns: [cytostatic agents, cancer medications, cancer drugs], seen_in: [ema:st_johns_wort, nccih:st-johns-wort]}
  - {label: hormonal contraceptives, atc: [G03A], patterns: [hormonal contraceptives, birth control pills, oral contraceptives], seen_in: [ema:st_johns_wort, nccih:st-johns-wort]}
  - {label: antidepressants, atc: [N06A], patterns: [antidepressants], seen_in: [ema:st_johns_wort, nccih:st-johns-wort]}
  - {label: SSRIs, atc: [N06AB], patterns: [serotonin reuptake inhibitors, serotonin-uptake inhibitors, selective serotonin reuptake inhibitors, SSRIs], seen_in: [ema:st_johns_wort]}
  - {label: anaesthetics, atc: [N01], patterns: [products used during general and regional anaesthesia], seen_in: [ema:st_johns_wort]}
  - {label: antiepileptics, atc: [N03A], patterns: [drugs used to prevent seizures, antiepileptic drugs, anticonvulsants], seen_in: [nccih:st-johns-wort]}
  - {label: statins, atc: [C10AA], patterns: [statins], seen_in: [nccih:st-johns-wort]}
  - {label: antihypertensives, atc: [C02], patterns: [antihypertensive action of prescribed medications, antihypertensive medications, antihypertensives], seen_in: [ema:liquorice]}
  - {label: diuretics, atc: [C03], patterns: [diuretics], seen_in: [ema:liquorice, ema:senna]}
  - {label: cardiac glycosides, atc: [C01A], patterns: [cardiac glycosides], seen_in: [ema:liquorice, ema:senna]}
  - {label: antiarrhythmics, atc: [C01B], patterns: [antiarrhythmic medicinal products, antiarrhythmic drugs, antiarrhythmics], seen_in: [ema:senna]}
  - {label: systemic corticosteroids, atc: [H02], patterns: [adrenocorticosteroids, corticosteroids], seen_in: [ema:liquorice, ema:senna, nccih:licorice-root]}
  - {label: stimulant (contact) laxatives, atc: [A06AB], patterns: [stimulant laxatives], seen_in: [ema:liquorice]}
  - {label: hypnotics and sedatives, atc: [N05C], patterns: [sedative substances, sedatives], seen_in: [ema:green_tea]}
  - {label: beta blockers, atc: [C07], patterns: [beta-blocker, beta-blockers, beta blockers], seen_in: [nccih:green-tea]}

unmapped:
  # Recognised drug references without a defensible single ATC mapping.
  - {phrase: sympathomimetic drugs, reason: "Sympathomimetics span several ATC groups (C01CA, R01BA, R03C, ...); the monograph does not specify which.", seen_in: [ema:green_tea]}
  - {phrase: heart medications, reason: "Too unspecific.", seen_in: [nccih:st-johns-wort]}
  - {phrase: liquorice root, reason: "A herbal substance, not a drug; herb–herb interactions are outside the drug lexicon.", seen_in: [ema:senna]}
  - {phrase: medications which may aggravate electrolyte imbalance, reason: "Functional description, not a drug class.", seen_in: [ema:liquorice]}
