  - {name: sirolimus, patterns: [sirolimus], seen_in: [ema:st_johns_wort]}
  - {name: tacrolimus, patterns: [tacrolimus], seen_in: [ema:st_johns_wort, ema:cranberry]}
  - {name: fosamprenavir, patterns: [fosamprenavir], seen_in: [ema:st_johns_wort]}
  - {name: indinavir, patterns: [indinavir], seen_in: [ema:st_johns_wort, nccih:st-johns-wort]}
  - {name: irinotecan, patterns: [irinotecan], seen_in: [ema:st_johns_wort, nccih:st-johns-wort]}
