  - {name: simvastatin, patterns: [simvastatin], seen_in: [ema:st_johns_wort, nccih:st-johns-wort]}
  - {name: digoxin, patterns: [digoxin], seen_in: [ema:st_johns_wort, nccih:st-johns-wort]}
  - {name: finasteride, patterns: [finasteride], seen_in: [ema:st_johns_wort]}
  - {name: sertraline, patterns: [sertraline], seen_in: [ema:st_johns_wort]}
  - {name: paroxetine, patterns: [paroxetine], seen_in: [ema:st_johns_wort]}
  - {name: buspirone, patterns: [buspirone], seen_in: [ema:st_johns_wort]}
  - {name: saquinavir, patterns: [saquinavir], seen_in: [ema:garlic]}
  - {name: ritonavir, patterns: [ritonavir], seen_in: [ema:garlic]}
  - {name: phenprocoumon, patterns: [phenprocoumon], seen_in: [ema:ginkgo]}
  - {name: warfarin, patterns: [warfarin], seen_in: [ema:ginkgo, ema:saw_palmetto, ema:cranberry, nccih:ginkgo, nccih:cranberry, nccih:st-johns-wort]}
  - {name: clopidogrel, patterns: [clopidogrel], seen_in: [ema:ginkgo]}
  - {name: aspirin, patterns: [acetylsalicylic acid, aspirin], seen_in: [ema:ginkgo, nccih:garlic]}
