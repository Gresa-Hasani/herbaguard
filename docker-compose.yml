# HerbaGuard local stack: PostgreSQL + pgvector, FastAPI backend, React frontend (nginx).
# Usage: cp .env.example .env && docker compose up --build
name: herbaguard

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-herbaguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-herbaguard}
      POSTGRES_DB: ${POSTGRES_DB:-herbaguard}
    ports:
      # Host port defaults to 5455 to avoid clashing with a locally installed PostgreSQL.
      - "127.0.0.1:${HERBAGUARD_DB_HOST_PORT:-5455}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      HERBAGUARD_ENVIRONMENT: ${HERBAGUARD_ENVIRONMENT:-development}
      HERBAGUARD_LOG_LEVEL: ${HERBAGUARD_LOG_LEVEL:-INFO}
      HERBAGUARD_LOG_FORMAT: json
      HERBAGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-herbaguard}:${POSTGRES_PASSWORD:-herbaguard}@db:5432/${POSTGRES_DB:-herbaguard}
      HERBAGUARD_CORS_ORIGINS: '["http://localhost:${HERBAGUARD_WEB_HOST_PORT:-18080}","http://localhost:5173"]'
      HERBAGUARD_RAW_DATA_DIR: /data/raw
      # Phase 5: Ollama runs on the host (CPU or GPU), not in a container.
      HERBAGUARD_ASSISTANT_PROVIDER: ${HERBAGUARD_ASSISTANT_PROVIDER:-ollama}
      HERBAGUARD_OLLAMA_BASE_URL: ${HERBAGUARD_OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      HERBAGUARD_OLLAMA_CHAT_MODEL: ${HERBAGUARD_OLLAMA_CHAT_MODEL:-qwen2.5:3b}
      HERBAGUARD_OLLAMA_EMBED_MODEL: ${HERBAGUARD_OLLAMA_EMBED_MODEL:-all-minilm}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop provides it already).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/raw:/data/raw
    ports:
      - "127.0.0.1:${HERBAGUARD_API_HOST_PORT:-18010}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${HERBAGUARD_WEB_HOST_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
